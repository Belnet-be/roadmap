openapi: 3.1.0
info:
  title: API Belnet v1
  version: 1.0.0-alpha+spr0021
  description: |-
    The Belnet extension of the standard APIs for the DMPonline application.

    ## Goal and scope

    ## Details
    * All list endpoints support pagination, with a default of 100 items per page.

    ## Open points
    * [x] Extra endpoint to query for DMPs.
    * [ ] Write out
      * [ ] GetVersionedPlanResponse and GetEditablePlanResponse
      * [ ] RegularCreatePlanLifecycleStageResponse
      * [x] Examples for DMP queries with filters
    * [x] Check fields required or not, and allowed values for all request and response schemas
    * [ ] Error messages
    * [x] Update schemas for config payloads
    * [x] Change `dmp_stages` to `lifecycle_stages` in config responses to make it consistent with other endpoints
    * [x] Change `validation` to `dmp_validation` in validation responses to make it consistent with other endpoints
    * [x] Correct the `lifecycle-stage` field to `lifecycle_stage` in all examples and responses

servers:
  - description: Internal TEST environment
    url: https://dmponline-test-1.tl.belnet.be
tags:
  - name: Plans
    description: Retrieving Data Management Plans (DMPs), but now either an _editable_ DMP or an _immutable_ version (read-only snapshot) of it.
  - name: Versions of plans
    description: Operations for creating and retrieving versions of Data Management Plans (DMPs).
  - name: Lifecycle stage of a plan
    description: Operations for creating and retrieving the lifecycle stage of a Data Management Plan (DMP).
  - name: Validations of plans
    description: Operations for creating and retrieving validation requests for Data Management Plans (DMPs).
  - name: Configurations
    description: Operations for retrieving configuration objects to support governance of Data Management Plans (DMPs). They are centrally managed and can't be modified via this API.
paths:
  /api/belnet-v1/plans:
    get:
      description: |
        Retrieves all or filtered Data Management Plans (DMPs) where the authentication account has access to,<br>
        but now the `plan_id` parameter refers to either an _editable_ DMP or an _immutable_ version (read-only snapshot) of it.<br>
        To make the distinction check the `dmp/extension/belnet/dmp_extension_type` value: it is either `editable` or `version`.
        * `dmp/dmp_id` refers still to the `plan_id` of the editable DMP.
        * `dmp/extension/belnet/dmp_version/dmp_id` refers to the `plan_id` of the immutable DMP version.

        Extra metadata:
        * Editable DMP:
          * `dmp/extension/belnet/dmp_editable` tracks currently only the DMP `lifecycle_stage`.
          * `dmp/extension/belnet/dmp_validations` tracks ALL validation requests for this DMP.
        * Immutable DMP version:
          * `dmp/extension/belnet/dmp_version` tracks DMP version information and the DMP `lifecycle_stage` at that moment.
          * `dmp/extension/belnet/dmp_validations` tracks ONLY the validation requests for this DMP version.

      operationId: get_plans
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - in: query
          name: response-depth
          schema:
            type: string
            enum:
              - id
              - summary
              - extended
            example: summary
            default: summary
          required: false
          description: |
            The result depends on the specified depth:
            * `id`: Returns only the `plan_id`s (full url so you can reference it).
              * Prime goal: retrieve number of plans via `total_items`.
            * `summary`: Returns only some basic information to support further queries.
              * `plan_id` (full url so you can reference it)
              * `title`
              * either `editable` or its `version_number`
              * `lifecycle_stage`
            * `extended`: Returns only but all the DMP parameters used as query parameters.

            We don't provide a `full` response depth for this endpoint.<br>
            A full response depth is only supported for the `GET /api/belnet-v1/plans/{plan_id}` endpoint,
            where you can retrieve a specific plan with all its details and metadata.
        - in: query
          name: title-contains
          schema:
            type: string
            example: the impact of
          required: false
          description: |
            If provided, filters the results to include only plans where the DMP project title contains the specified string.
        - in: query
          name: time-period
          schema:
            type: string
            enum:
              - 1d
              - 7d
              - 30d
              - 3m
              - 6m
              - 12m
              - 2y
            example: 30d
          required: false
          description: |
            If provided, filters the results to include only plans created or modified since the specified time period.
        - in: query
          name: template-id
          schema:
            type: number
            example: 3578
          required: false
          description: |
            If provided, filters the results to include only plans created from the specified template ID.

            For allowed values check the `GET /api/v1/templates` endpoint, and look for the `dmp_template/template_id/identifier` field.
        - in: query
          name: lifecycle-stage
          schema:
            type: string
            example: Working Draft
          required: false
          description: |
            If provided, filters the results to include only plans with the specified lifecycle stage.

            For allowed values check the `full_list` via the `GET /api/belnet-v1/configurations/lifecycle-stages` endpoint.
        - in: query
          name: validation-topic
          schema:
            type: string
            example: GDPR
          required: false
          description: |
            If provided, filters the results to include only plans with the specified validation topic.

            For allowed values check the `full_list` via the `GET /api/belnet-v1/configurations/validation-topics` endpoint.
        - in: query
          name: validation-status
          schema:
            type: string
            example: Pending Review
          required: false
          description: |
            If provided, filters the results to include only plans with the specified validation status.

            For allowed values check the `full_list` via the `GET /api/belnet-v1/configurations/validation-statuses` endpoint.
        - in: query
          name: min-completion-rate
          schema:
            type: number
            enum:
              - 25
              - 50
              - 75
              - 100
            example: 50
          required: false
          description: |
            If provided, filters the results to include only plans with at least the specified completion rate in percent.
        - in: query
          name: include-versions
          schema:
            type: boolean
            default: false
            example: true
          required: false
          description: |
            If `true`, consider also _immutable_ versions (read-only snapshots) of plans in the results.

            Otherwise, only _editable_ plans are considered in the results.
        - in: query
          name: pending-my-review
          schema:
            type: boolean
            default: false
            example: true
          required: false
          description: |
            If provided, filters the results to include only plans that require my review.

            TBC: what are the criteria for a plan to require my review?
        - in: query
          name: plan-visibility
          schema:
            type: string
            enum:
              - public
              - organisational
              - private
              - test
            example: private
          required: false
          description: |
            If provided, filters the results to include only plans with the specified visibility.

            **Note**: `test` is a special visibility level:
            * These plans have `private` visibility, but only for testing purposes.
            * If selected `private` show only the plans with private visibility, but not the test plans.

      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPlanResponse"
              examples:
                by_id:
                  $ref: "#/components/examples/GetPlansResponseById"
                by_summary:
                  $ref: "#/components/examples/GetPlansResponseBySummary"
                by_extended:
                  $ref: "#/components/examples/GetPlansResponseByExtended"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
          description: Bad Request
      tags:
        - Plans
  /api/belnet-v1/plans/{plan_id}:
    get:
      description: |
        Retrieves a Data Management Plan (DMP), but now the `plan_id` parameter refers to either an _editable_ DMP or an _immutable_ version (read-only snapshot) of it.<br>
        To make the distinction check the `dmp/extension/belnet/dmp_extension_type` value: it is either `editable` or `version`.
        * `dmp/dmp_id` refers still to the `plan_id` of the editable DMP.
        * `dmp/extension/belnet/dmp_version/dmp_id` refers to the `plan_id` of the immutable DMP version.

        Extra metadata:
        * Editable DMP:
          * `dmp/extension/belnet/dmp_editable` tracks currently only the DMP `lifecycle_stage`.
          * `dmp/extension/belnet/dmp_validations` tracks ALL validation requests for this DMP.
        * Immutable DMP version:
          * `dmp/extension/belnet/dmp_version` tracks DMP version information and the DMP `lifecycle_stage` at that moment.
          * `dmp/extension/belnet/dmp_validations` tracks ONLY the validation requests for this DMP version.

      operationId: get_plan
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/VersionedPlanIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPlanResponse"
              # examples:
              #   versioned:
              #     $ref: "#/components/examples/GetVersionedPlanResponse"
              #   editable:
              #     $ref: "#/components/examples/GetEditablePlanResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
          description: Bad Request
      tags:
        - Plans
  /api/belnet-v1/plans/{plan_id}/versions:
    post:
      description: |
        Creates a _immutable_ DMP version (read-only snapshot) of the current _editable_ DMP.

        A `reason` (motivation) for the DMP version is required between 10 and 500 characters.

        A `lifecycle_stage` is only required when you want to change the DMP lifecycle stage with this version of the DMP.<br>
        For allowed values check the `current_list` via the `GET /api/belnet-v1/configurations/lifecycle-stages` endpoint.
      operationId: create_plan_version
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/PlanIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanVersionRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePlanVersionResponse"
              examples:
                regular:
                  $ref: "#/components/examples/RegularCreatePlanVersionResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
              #   Error2:
              #     $ref: "#/components/examples/Error2"
          description: Bad Request
      tags:
        - Versions of plans
    get:
      description: |
        Retrieves all versions of a specific Data Management Plan (DMP).
        You could use `dmp_version/dmp_id` to lookup the full DMP.

        NOTE: It will not list the _editable_ DMP, which is not considered a version of the DMP.
      operationId: get_plan_versions
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/PlanIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPlanVersionsResponse"
              examples:
                regular:
                  $ref: "#/components/examples/RegularGetPlanVersionsResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
          description: Bad Request
      tags:
        - Versions of plans
  /api/belnet-v1/plans/{plan_id}/versions/{version_number}:
    get:
      description: |
        Retrieves a specific version of a Data Management Plan (DMP).
        You could use `dmp_version/dmp_id` to lookup the full DMP.
      operationId: get_plan_version
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/PlanIdParam"
        - $ref: "#/components/parameters/VersionNumberParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPlanVersionResponse"
              examples:
                regular:
                  $ref: "#/components/examples/RegularGetPlanVersionResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
          description: Bad Request
      tags:
        - Versions of plans
    put:
      description: |
        Update a specific version of a Data Management Plan (DMP).

        Either the `reason` or the `lifecycle_stage` must be provided, but at least one of them is required.<br>
        For allowed values for the `lifecycle_stage` parameter check the `current_list` via the `GET /api/belnet-v1/configurations/lifecycle-stages` endpoint.

        You could use `dmp_version/dmp_id` to lookup the full DMP.
      operationId: put_plan_version
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/PlanIdParam"
        - $ref: "#/components/parameters/UpdatedVersionNumberParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanVersionRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePlanVersionResponse"
              examples:
                regular:
                  $ref: "#/components/examples/RegularUpdatePlanVersionResponse"
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
          description: Bad Request
      tags:
        - Versions of plans
  /api/belnet-v1/plans/{plan_id}/lifecycle-stage:
    post:
      description: |
        Add a `lifecycle_stage` to an _editable_ DMP, the minimum governance level you can add.<br>
        For allowed values check the `current_list` via the `GET /api/belnet-v1/configurations/lifecycle-stages` endpoint.
        * An option to manage older DMPs with minimum effort.

        Note 1: No further governance at this moment.
        API user is responsible to keep the `lifecycle_stage` on _editable_ DMP
        consistent with the `lifecycle_stage` on DMP _versions_.

        Note 2: This entrypoint is currently only for _editable_ DMP (MVP).
        We could support it for DMP versions, using `plan_id` for a version, at a later stage.

      operationId: create_plan_stage
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/PlanIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanLifecycleStageRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePlanLifecycleStageResponse"
              # examples:
              #   regular:
              #     $ref: "#/components/examples/RegularCreatePlanLifecycleStageResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
              #   Error2:
              #     $ref: "#/components/examples/Error2"
          description: Bad Request
      tags:
        - Lifecycle stage of a plan
    get:
      description: |
        Retrieves the lifecycle stage of the _editable_ DMP.
      operationId: get_plan_stage
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/PlanIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPlanLifecycleStageResponse"
              # examples:
              #   regular:
              #     $ref: "#/components/examples/RegularGetPlanLifecycleStageResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
          description: Bad Request
      tags:
        - Lifecycle stage of a plan
    put:
      description: |
        Updates the `lifecycle_stage` of the _editable_ DMP.<br>
        For allowed values check the `current_list` via the `GET /api/belnet-v1/configurations/lifecycle-stages` endpoint.
      operationId: update_plan_stage
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/PlanIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanLifecycleStageRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePlanLifecycleStageResponse"
              # examples:
              #   regular:
              #     $ref: "#/components/examples/RegularUpdatePlanLifecycleStageResponse"
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
          description: Bad Request
      tags:
        - Lifecycle stage of a plan
  /api/belnet-v1/plans/{plan_id}/validations:
    post:
      description: |
        Creates a new validation request for a specific _immutable_ version of a Data Management Plan (DMP).<br>
        For allowed values for the `dmp_version_number` check the `GET /api/belnet-v1/plans/{plan_id}/versions` endpoint.<br>
        For allowed values for the validation `topic`, check the `current_list` via the `GET /api/belnet-v1/configurations/validation-topics` endpoint.
      operationId: create_plan_validation
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/PlanIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanValidationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePlanValidationResponse"
              examples:
                regular:
                  $ref: "#/components/examples/RegularCreatePlanValidationResponse"
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
              #   Error2:
              #     $ref: "#/components/examples/Error2"
          description: Bad Request
      tags:
        - Validations of plans
    get:
      description: |
        Retrieves all validation requests for all versions of a specific Data Management Plan (DMP).
      operationId: get_plan_validations
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/PlanIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPlanValidationsResponse"
              examples:
                regular:
                  $ref: "#/components/examples/RegularGetPlanValidationsResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
          description: Bad Request
      tags:
        - Validations of plans
  /api/belnet-v1/plans/{plan_id}/validations/{validation_id}:
    get:
      description: Retrieves a specific validation request for a Data Management Plan (DMP).
      operationId: get_plan_validation
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/PlanIdParam"
        - $ref: "#/components/parameters/ValidationIdParam"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPlanValidationResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
          description: Bad Request
      tags:
        - Validations of plans
    put:
      description:
        Updates a specific validation request for a Data Management Plan (DMP).<br>
        For allowed values for the validation `status`, check the `current_list` via the `GET /api/belnet-v1/configurations/validation-statuses` endpoint.
      operationId: update_plan_validation
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
        - $ref: "#/components/parameters/PlanIdParam"
        - $ref: "#/components/parameters/ValidationIdParam"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanValidationRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePlanValidationResponse"
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
          description: Bad Request
      tags:
        - Validations of plans
  /api/belnet-v1/configurations/lifecycle-stages:
    get:
      description: Retrieves all allowed values for the `lifecycle_stage` field of a specific Data Management Plan (DMP).
      operationId: get_config_lifecycle_stages
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetConfigLifecycleStagesResponse"
              examples:
                default:
                  $ref: "#/components/examples/RegularGetConfigLifecycleStagesResponse"
                org_specific:
                  $ref: "#/components/examples/OrganizationGetConfigLifecycleStagesResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
              # examples:
              #   Error1:
              #     $ref: "#/components/examples/Error1"
          description: Bad Request
      tags:
        - Configurations
  /api/belnet-v1/configurations/validation-topics:
    get:
      description: Retrieves all allowed validation topics that can be used to validate a specific Data Management Plan (DMP).
      operationId: get_config_validation_topics
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetConfigValidationTopicsResponse"
              examples:
                regular:
                  $ref: "#/components/examples/RegularGetConfigValidationTopicsResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
          description: Bad Request
      tags:
        - Configurations
  /api/belnet-v1/configurations/validation-statuses:
    get:
      description: Retrieves all allowed validation statuses that can be used to indicate the status of a validation request for a Data Management Plan (DMP).
      operationId: get_config_validation_statuses
      parameters:
        - $ref: "#/components/parameters/AcceptHeader"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetConfigValidationStatusesResponse"
              examples:
                regular:
                  $ref: "#/components/examples/RegularGetConfigValidationStatusesResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorUnauthorizedResponse"
          description: Bad Request
      tags:
        - Configurations
components:
  securitySchemes:
    MyClientId:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    # Base schemas
    PlanIdSchema:
      description: The unique identifier of a Data Management Plan (DMP).
      type: number
      example: 65875
    VersionIdSchema:
      description: The unique identifier of a specific version of a Data Management Plan (DMP). Don't confuse with the version number of a DMP.
      type: number
      example: 65877
    VersionNumberSchema:
      description: The version number of a Data Management Plan (DMP). Don't confuse with the version_id of a specific version of a DMP.
      type: number
      example: 2
    ValidationIdSchema:
      description: The unique identifier of a specific validation of a Data Management Plan (DMP).
      type: number
      example: 12345
