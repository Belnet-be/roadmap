services:
  postgres:
    image: postgres:17.5
    environment:
      TZ: Europe/Brussels
      # Sets the superuser and password for PostgreSQL
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Provide the parameters for the db-init scripts on startup.
      DB_NAME: ${DB_NAME:?DB_NAME must be set}
      DB2_NAME: ${DB2_NAME}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_IMPORT_FILE: ${DB_IMPORT_FILE}
      DB_ORIGINAL_SCHEMA: ${DB_ORIGINAL_SCHEMA}
    volumes:
      # Named volume to persist database data outside of container.
      # Format is "named_volume:path/in/container"
      - dmponline_data:/var/lib/postgresql/data
      # Host mount for one-time initialization.
      # Format is "./path/on/host:/path/in/container"
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./belnet/db-postgres/scripts:/docker-entrypoint-initdb.d
      - ./belnet/db-postgres/import:/data-import
    ports:
      # Map to something other than default 5432 on host in case Postgres
      # is also running natively on host.
      # Format is "host:container"
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  dmponline_data: