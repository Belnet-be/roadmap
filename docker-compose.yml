services:
  roadmap:
    build: .
    image: roadmap
    container_name: roadmap
    profiles:
      - prod
    volumes:
      - roadmap-config:/opt/roadmap/config
    env_file:
      - .env.compose.roadmap
      - .env.compose.postgres
    environment:
      - ENV=prod
    ports:
      - 3000:3000
    depends_on:
      - postgres

  roadmap-dev:
    build: .
    image: roadmap
    container_name: roadmap
    profiles:
      - dev
    volumes:
      - roadmap-config:/opt/roadmap/config
    env_file:
      - .env.compose.roadmap
      - .env.compose.postgres
    environment:
      - BIND_ADDRESS=0.0.0.0
      - RAILS_ENV=development
    ports:
      - 3000:3000
    depends_on:
      - postgres

  postgres:
    image: postgres
    container_name: postgres
    profiles:
      - prod
      - dev
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - .env.compose.postgres
    ports:
      - 5432:5432

  mail:
    image: mailhog/mailhog
    profiles:
      - dev
    container_name: mailhog
    ports:
      - 8025:8025

  pgadmin:
    image: dpage/pgadmin4
    profiles:
      - dev
    container_name: pgadmin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    env_file:
      - .env.compose.postgres
    ports:
      - 80:80

volumes:
  postgres-data:
  roadmap-config:
  pgadmin-data:
